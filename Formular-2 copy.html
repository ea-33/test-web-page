    <script type="text/javascript">
        function setzeFokus() {
            window.document.Kontaktformular.Name.focus();
        }
        function istTextDa(meinText) {
            if (meinText == "") {
                alert("Bitte geben Sie eine Nachricht ein.");
                window.document.Kontaktformular.Nachricht.focus();
            }
        } 
    </script>
</head>

<body onload="setzeFokus()">
    <!-- Hier stehen Menü und Seitentext, diese sind hier weggelassen. -->
    <h3>Fragen Sie uns!</h3>
    Felder <strong>in fett</strong> sind Pflichtangaben.
    <form name="Kontaktformular" class="kontaktformular" method="post" action="Formular-Feedback.php">
        <fieldset>
            <legend>Ihre Frage an uns</legend>
            <label for="Name">Name:</label>
            <input type="text" name="Name" value=""><br>

            <label for="email" class="bold">E-Mail-Adresse:</label>
            <input type="text" name="email" value=""><br>

            <label for="Nachricht" class="bold">Ihre Nachricht: </label>
            <textarea name="Nachricht" onBlur="istTextDa(this.value)">
         </textarea><br>

            <input type="submit" name="Submitbutton" id="submitbutton" value="Abschicken">
        </fieldset>
    </form>
