<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Formspree-Test</title>
</head>
<body>

    <h1>Kontaktformular</h1>

    <form action="https://formspree.io/f/mzepzgoe" method="POST">

        <label for="name">Name</label>
        <input
            type="text"
            id="name"
            name="name"
            required
        >

        <br><br>

        <label for="email">E-Mail-Adresse</label>
        <input
            type="email"
            id="email"
            name="email"
            required
        >

        <br><br>

        <label for="message">Nachricht</label>
        <textarea
            id="message"
            name="message"
            required
        ></textarea>

        <br><br>

        <button type="submit">Nachricht senden</button>

    </form>

</body>
</html>
